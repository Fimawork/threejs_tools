	<body>


		<div class="side-year">2026</div>

		<script type="module">

import * as THREE from 'three';

import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as FX from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.48/fx_functions.js';
import * as FXM from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@v2.0/fx_materials.js';
import * as FXUI from 'https://cdn.jsdelivr.net/gh/Fimawork/threejs_tools@2.43/fx_hud.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { TIFFLoader } from 'three/addons/loaders/TIFFLoader.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';


import { Inspector } from 'three/addons/inspector/Inspector.js';

import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';


let scene, camera, renderer, stats, mixer;

let controls;


const timer = new THREE.Timer();

const modelPosition=new THREE.Vector3(0,0,0);
const modelRotation=new THREE.Vector3(0,FX.ToThreeEulerAngle(90), 0);
const modeScale=1;

const CameraDefaultPos=new THREE.Vector3(0,2,3);
const ControlsTargetDefaultPos=new THREE.Vector3(0,0.5,0);

let main_model= new THREE.Object3D();



let idleTime=0;
const hold_time=6;


init();
//FX.Camera_Inspector(camera,controls);

async function init()
{
	FX.SetupEnvironment("cloud");

  	scene = new THREE.Scene();
	scene.background = null;

  	camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 100 );//非全螢幕比例設定設定
  	renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true });
  	renderer.setSize(window.innerWidth, window.innerHeight);

  	renderer.setClearColor(0x000000, 0.0);//需加入這一條，否則看不到CSS的底圖
  	renderer.toneMapping = THREE.ACESFilmicToneMapping;
  	renderer.toneMappingExposure = 0.9;
  	document.body.appendChild( renderer.domElement );
	//renderer.inspector = new Inspector();

	// 1. 先等待 Renderer 初始化完成
	await renderer.init(); // 記得 r184 一定要加上這行非同步初始化！

  	camera.position.copy(CameraDefaultPos);
  
  	///利用座標設定旋轉中心及鏡頭焦點，camera不須另外設定初始角度
	controls = new OrbitControls( camera, renderer.domElement);
  	controls.enablePan = true;//右鍵平移效果
  	controls.panSpeed = 0.4;
  	controls.enableDamping = true;
  	controls.dampingFactor =0.015;
  	controls.target.copy( ControlsTargetDefaultPos );
  	controls.zoomSpeed=0.5;
	controls.autoRotate=false;
	controls.autoRotateSpeed=0.3;

	controls.maxPolarAngle=FX.ToThreeEulerAngle(95);
	controls.minPolarAngle=FX.ToThreeEulerAngle(-90);
  	controls.update();

  	///hdri 環境光源
	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene);
	scene.environmentRotation.y = FX.ToThreeEulerAngle(-180); 
	



	const loader = new GLTFLoader();
	loader.load( './EC-002M_20261118_compressed.glb', function ( gltf ) {

		const model = gltf.scene;

		const loader = new THREE.TextureLoader();

		const rollsys_white_textureMap = loader.load('/textures/Light_Gravel.png');
		rollsys_white_textureMap.wrapS = THREE.RepeatWrapping; // 允許水平重複
		rollsys_white_textureMap.wrapT = THREE.RepeatWrapping; // 允許垂直重複
		rollsys_white_textureMap.repeat.set(500, 500);    // X, Y 各重複 2 次
		rollsys_white_textureMap.offset.set(0, 0); // X, Y 的偏移量

		const rollsys_white= new THREE.MeshPhysicalMaterial( {
		    color: 0xe5e9eb, 
		    transparent:false,//沒設定，畫面會出錯
		    metalness: 0, 
		    roughness: 0.3, 
		    opacity:1,
		    map: rollsys_white_textureMap
		} );


		main_model.add(model);
		scene.add(main_model);
		
		FX.ReplaceMaterial(scene, "RollsysWhite", rollsys_white);


		setTimeout(() => {
			// 2. 模型套用新材質與生成後，再啟動動畫循環（避免出現黑色模型）
			renderer.setAnimationLoop( animate );
			FX.USDZ_GLB_Exporter(main_model);// 絕對不要加到 camera
			//FX.Material_Inspector_TypeB(main_model);
			
		}, 1000);
		
	});



	

//	//影子工具
//	FX.InitWebGPUShadow(scene, {
//     shadow: { blur: 0.5, darkness: 0.25 },
//     plane: { color: '#ffffff', opacity: 1 }
//});


	///EventListener
  	window.addEventListener( 'resize', onWindowResize );  

  		window.addEventListener("pointerdown", (event) => {
		
		idleTime=0;
		controls.autoRotate=false;
	
	});

	window.addEventListener( 'pointermove', function(e) {
		
		idleTime=0;
		controls.autoRotate=false;
		
	});

  	window.addEventListener("wheel", (event) => {
		
		idleTime=0;
		controls.autoRotate=false;
		
	});
	
}

//function exportUSDZ() {
//
//				const link = document.getElementById( 'link' );
//				link.click();
//
//			}


function onWindowResize() 
{
    camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
     renderer.setSize( window.innerWidth, window.innerHeight);
}

function animate(timestamp) 
{

  	controls.update();
  	renderer.render( scene, camera );

  	// 自動更新時間（用來計算移動速度、旋轉等）
    timer.update( timestamp );
	const delta = timer.getDelta();


	if ( mixer ) mixer.update( delta );

}





		</script>
    </body>
