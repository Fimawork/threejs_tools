<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>CameraManager  | fx_functions</title>
		<link rel="stylesheet" type="text/css" href="fx_ui.css">
		<style type="text/css">
			*{ 
				box-sizing: border-box; 
				margin: 0; 
				padding: 0; 
			}

    		body { 
				display: flex; 
				width: 100vw; 
				height: 100vh; 
				overflow: hidden; 
			}
    
    		/* 左側程式碼編輯區 */
    		#editor-container {
    		  width: 50%;
    		  height: 100%;
    		  background: #1e1e1e;
    		}

    		/* 右側 Three.js 渲染區 */
    		#render-container {
    		  width: 50%;
    		  height: 100%;
    		  position: relative;
    		}
    
    		canvas { 
				width: 100%; 
				height: 100%; 
				display: block; 
			}

			.btn_holder
			{
				position: absolute;
				bottom: 30px;
				width: 100%;
				height: 60px;
				display: flex;
				justify-content: center;
			}

			.controller_btn
			{
				width: 120px;
				height: 36px;
				cursor: pointer;
                border-radius: 6px;
				margin: 0 6px;
                display: flex;
				justify-content: center;
                flex-direction:column;
                text-align:center;
				font-size: 15px;
				font-family:'Times New Roman', Times, serif;
			}

			.controller_btn:hover
			{
				color: white;
				background-color: #00eeff;
			}

		</style>

		<script type="importmap">
			{
			  "imports": {
			    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
			    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
			  }
			}
		</script>
	</head>

	<body>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
		<div id="editor-container"></div>
  		<div id="render-container">
			<div class="btn_holder">
				<button class="controller_btn" id="btn_1">Default</button>
				<button class="controller_btn" id="btn_2">viewport_1</button>
				<button class="controller_btn" id="btn_3">viewport_2</button>
				<button class="controller_btn" id="btn_4">viewport_3</button>
				<button class="controller_btn" id="btn_5">viewport_4</button>
			</div>
		</div>
		
		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import * as FX from './fx_functions.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
		
			let scene, camera, renderer, controls;
			let threeContainer = document.getElementById("render-container");

			let _btn_1 = document.getElementById("btn_1");
			let _btn_2 = document.getElementById("btn_2");
			let _btn_3 = document.getElementById("btn_3");
			let _btn_4 = document.getElementById("btn_4");
			let _btn_5 = document.getElementById("btn_5");

			const CameraDefaultPos = new THREE.Vector3(0, 2.5, 4.5);
			const ControlsTargetDefaultPos = new THREE.Vector3(0, 0, 0);

			init();

			async function init() 
			{
				FX.SetupEnvironment("cloud");

				scene = new THREE.Scene();
				camera = new THREE.PerspectiveCamera(24, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 100);
				renderer = new THREE.WebGPURenderer({ antialias: true });
				renderer.inspector = new Inspector();
				renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
				threeContainer.appendChild(renderer.domElement);

				const loader_logo = new GLTFLoader();
				loader_logo.setDRACOLoader(FX.dracoLoader);
				loader_logo.load('./models/logo_type_B.glb', function ( gltf ) {

					const model = gltf.scene;
					model.position.set(0, 0, 0);
					model.scale.set(1, 1,1);

					scene.add(model);

				});

				await renderer.init();

				camera.position.copy(CameraDefaultPos);

				controls = new OrbitControls(camera, renderer.domElement);
				controls.enablePan = false;
				controls.panSpeed = 0.4;
				controls.enableDamping = true;
				controls.target.copy(ControlsTargetDefaultPos);
				controls.zoomSpeed = 0.5;
				controls.autoRotate = false;
				controls.update();

				FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene);

				///1.建議利用位置0來紀錄初始位置
				FX.posData[0]={ camera_pos:CameraDefaultPos, controlsTarget_pos:ControlsTargetDefaultPos};

				/*2.可利用FX.Camera_Inspector或FX.Hierarchy功能查詢camera position & Controls target進行視角設定。
				FX.Camera_Inspector(camera,controls);*/

				FX.posData[1]={ camera_pos:new THREE.Vector3(3.415,2.500,8), controlsTarget_pos:new THREE.Vector3(0,0.1,0)};
				FX.posData[2]={ camera_pos:new THREE.Vector3(5.000,0.148,0.000), controlsTarget_pos:new THREE.Vector3(0.1,0.000,0.1)};
				FX.posData[3]={ camera_pos:new THREE.Vector3(-2.477,1.298,-2.981), controlsTarget_pos:new THREE.Vector3(-0.1,0,0)};
				FX.posData[4]={ camera_pos:new THREE.Vector3(-2.229,-2.475,2.368), controlsTarget_pos:new THREE.Vector3(0.1,0,0.1)};
				
				///3.功能觸發方式
				_btn_1.addEventListener('click', () => {FX.CameraManager_Type_B(0,camera,controls,threeContainer,3000);}); //鏡頭飛行時間3秒
				_btn_2.addEventListener('click', () => {FX.CameraManager_Type_B(1,camera,controls,threeContainer,2500);}); //鏡頭飛行時間2.5秒
				_btn_3.addEventListener('click', () => {FX.CameraManager_Type_B(2,camera,controls,threeContainer,2000);}); //鏡頭飛行時間2秒
				_btn_4.addEventListener('click', () => {FX.CameraManager_Type_B(3,camera,controls,threeContainer,1500);}); //鏡頭飛行時間1.5秒
				_btn_5.addEventListener('click', () => {FX.CameraManager_Type_B(4,camera,controls,threeContainer,1000);}); //鏡頭飛行時間1秒
				
				renderer.setAnimationLoop(animate);
				window.addEventListener('resize', onWindowResize);
			}

			function onWindowResize() 
			{
				camera.aspect = threeContainer.clientWidth / threeContainer.clientHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
			}

			function animate(timestamp) 
			{
				controls.update();
				renderer.render(scene, camera);
			}

			
const code_content = `
		
// CameraManager工具使用範例 

/*<!-- HTML element -->
<button class="controller_btn" id="btn_1">Default</button>
<button class="controller_btn" id="btn_2">viewport_1</button>
<button class="controller_btn" id="btn_3">viewport_2</button>
<button class="controller_btn" id="btn_4">viewport_3</button>
<button class="controller_btn" id="btn_5">viewport_4</button>

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CameraDefaultPos = new THREE.Vector3(0, 2.5, 4.5);
const ControlsTargetDefaultPos = new THREE.Vector3(0, 0, 0);

init();

async function init() 
{
	FX.SetupEnvironment("cloud");

	renderer = new THREE.WebGPURenderer({ antialias: true });

	renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);

	const loader_logo = new GLTFLoader();

	loader_logo.load('./models/logo_type_B.glb', function ( gltf ) {

		const model = gltf.scene;
		model.position.set(0, 0, 0);
		model.scale.set(1, 1,1);

		scene.add(model);

	});

	await renderer.init();

	camera.position.copy(CameraDefaultPos);

	controls = new OrbitControls(camera, renderer.domElement);
	controls.enablePan = false;
	controls.panSpeed = 0.4;
	controls.enableDamping = true;
	controls.target.copy(ControlsTargetDefaultPos);
	controls.zoomSpeed = 0.5;
	controls.autoRotate = false;
	controls.update();

	FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene);

	///1.建議利用位置0來紀錄初始位置
	FX.posData[0]={ camera_pos:CameraDefaultPos, controlsTarget_pos:ControlsTargetDefaultPos};

	/*2.可利用FX.Camera_Inspector或FX.Hierarchy功能查詢camera position & Controls target進行視角設定。
	FX.Camera_Inspector(camera,controls);*/

	FX.posData[1]={ camera_pos:new THREE.Vector3(3.415,2.500,8), controlsTarget_pos:new THREE.Vector3(0,0.1,0)};
	FX.posData[2]={ camera_pos:new THREE.Vector3(5.000,0.148,0.000), controlsTarget_pos:new THREE.Vector3(0.1,0.000,0.1)};
	FX.posData[3]={ camera_pos:new THREE.Vector3(-2.477,1.298,-2.981), controlsTarget_pos:new THREE.Vector3(-0.1,0,0)};
	FX.posData[4]={ camera_pos:new THREE.Vector3(-2.229,-2.475,2.368), controlsTarget_pos:new THREE.Vector3(0.1,0,0.1)};
				
	///3.功能觸發方式
	_btn_1.addEventListener('click', () => {FX.CameraManager_Type_B(0,camera,controls,threeContainer,3000);}); //鏡頭飛行時間3秒
	_btn_2.addEventListener('click', () => {FX.CameraManager_Type_B(1,camera,controls,threeContainer,2500);}); //鏡頭飛行時間2.5秒
	_btn_3.addEventListener('click', () => {FX.CameraManager_Type_B(2,camera,controls,threeContainer,2000);}); //鏡頭飛行時間2秒
	_btn_4.addEventListener('click', () => {FX.CameraManager_Type_B(3,camera,controls,threeContainer,1500);}); //鏡頭飛行時間1.5秒
	_btn_5.addEventListener('click', () => {FX.CameraManager_Type_B(4,camera,controls,threeContainer,1000);}); //鏡頭飛行時間1秒
				
	renderer.setAnimationLoop(animate);
	window.addEventListener('resize', onWindowResize);
}

function onWindowResize() 
{

function animate(timestamp) 
{

`;

			// 3. 載入 Monaco Editor 顯示左側程式碼
require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
require(['vs/editor/editor.main'], function() {
  monaco.editor.create(document.getElementById('editor-container'), {

		</script>
	</body>
</html>
