<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Inst Dimension Labels | fx_functions</title>
		<link rel="stylesheet" type="text/css" href="fx_ui.css">
		<style type="text/css">
	
			*{ 
				box-sizing: border-box; 
				margin: 0; 
				padding: 0; 
			}

    		body { 
				display: flex; 
				width: 100vw; 
				height: 100vh; 
				overflow: hidden; 
			}
    
    		/* 左側程式碼編輯區 */
    		#editor-container {
    		  width: 50%;
    		  height: 100%;
    		  background: #1e1e1e;
    		}

    		/* 右側 Three.js 渲染區 */
    		#render-container {
    		  width: 50%;
    		  height: 100%;
    		  position: relative;
    		}
    
    		canvas { 
				width: 100%; 
				height: 100%; 
				display: block; 
			}

			.btn_holder
			{
				position: absolute;
				bottom: 30px;
				width: 100%;
				height: 60px;
				display: flex;
				justify-content: center;
			}

			.controller_btn
			{
				width: 120px;
				height: 36px;
				cursor: pointer;
                border-radius: 6px;
				margin: 0 6px;
                display: flex;
				justify-content: center;
                flex-direction:column;
                text-align:center;
				font-size: 15px;
				font-family:'Times New Roman', Times, serif;
			}

			.controller_btn:hover
			{
				color: white;
				background-color: #00eeff;
			}

			#labelContainer
			{
				position: absolute;
				top: 0;
				left: 0;
				pointer-events: none;
				z-index: 1;
			}

		</style>

		<script type="importmap">
			{
			  "imports": {
			    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
			    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
			  }
			}
		</script>
	</head>

	<body>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
		<div id="editor-container"></div>
  		<div id="render-container">
			<div class="btn_holder">
				<button class="controller_btn" id="btn_1">ADD DIM</button>
				<button class="controller_btn" id="btn_2">ROMOVE DIM</button>
			</div>
		</div>

		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import * as FX from './fx_functions.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			///1.使用Inst Dimension Labels時必須載入CSS2DRenerder,CSS2DObject
			import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

			let scene, camera, renderer, controls;
			let threeContainer = document.getElementById("render-container");

			let main_model = new THREE.Object3D();

			const CameraDefaultPos = new THREE.Vector3(-29.879,11.629,54.107);
			const ControlsTargetDefaultPos = new THREE.Vector3(0.000,0.000,0.000);

			let labelRenderer;

			//2.宣告變數，尺寸標註 Group，方便移除時呼叫 RemoveDimensionLabels(dim)
			let dim = null; 

			let _btn_1 = document.getElementById("btn_1");
			let _btn_2 = document.getElementById("btn_2");

			init();
			
			async function init() 
			{
				FX.SetupEnvironment("cloud");

				scene = new THREE.Scene();
				camera = new THREE.PerspectiveCamera(24, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 100);
				renderer = new THREE.WebGPURenderer({ antialias: true });
				renderer.inspector = new Inspector();
				renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
				threeContainer.appendChild(renderer.domElement);

				labelRenderer = new CSS2DRenderer();
				labelRenderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
				labelRenderer.domElement.id = "labelContainer";
				threeContainer.appendChild( labelRenderer.domElement );

				await renderer.init();

				camera.position.copy(CameraDefaultPos);

				controls = new OrbitControls(camera, renderer.domElement);
				controls.enablePan = false;
				controls.panSpeed = 0.4;
				controls.enableDamping = true;
				controls.target.copy(ControlsTargetDefaultPos);
				controls.zoomSpeed = 0.5;
				controls.autoRotate = false;
				controls.update();

				FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg', scene);

				const loader_logo = new GLTFLoader();
				loader_logo.setDRACOLoader(FX.dracoLoader);
				loader_logo.load('./models/logo_fimawork.glb', function ( gltf ) {

						const model = gltf.scene;
						model.position.set(0, 0, 0);
						model.scale.set(1, 1, 1);

						main_model.add(model);
						scene.add(main_model);

						///3.初始化顯示尺寸標處效果
						dim = FX.InstDimensionLabels(main_model, 1, 1, "mm")
					}
				);

				///4.功能觸發方式
				_btn_1.addEventListener('click', () => {if(!dim) dim = FX.InstDimensionLabels(main_model);}); //加入尺寸標註
				_btn_2.addEventListener('click', () => {FX.RemoveDimensionLabels(dim);dim=null;}); //移除尺寸標註

				renderer.setAnimationLoop(animate);
				window.addEventListener('resize', onWindowResize);

			}

			function onWindowResize() 
			{
				camera.aspect = threeContainer.clientWidth / threeContainer.clientHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
				labelRenderer.setSize( threeContainer.clientWidth, threeContainer.clientHeight);
			}

			function animate(timestamp) 
			{
				controls.update();
				renderer.render(scene, camera);

				///5.使用InstDimensionLabels時必須載入labelRenderer
				labelRenderer.render( scene, camera );
			}

		
const code_content = `

			// 3. 載入 Monaco Editor 顯示左側程式碼
require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
require(['vs/editor/editor.main'], function() {
  monaco.editor.create(document.getElementById('editor-container'), {

		</script>
	</body>
</html>
