<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Shadow | fx_functions</title>
		<style type="text/css">
			@import url('/fx_ui.css');

			*{ 
				box-sizing: border-box; 
				margin: 0; 
				padding: 0; 
			}

    		body { 
				display: flex; 
				width: 100vw; 
				height: 100vh; 
				overflow: hidden; 
			}
    
    		/* 左側程式碼編輯區 */
    		#editor-container {
    		  width: 50%;
    		  height: 100%;
    		  background: #1e1e1e;
    		}

    		/* 右側 Three.js 渲染區 */
    		#render-container {
    		  width: 50%;
    		  height: 100%;
    		  position: relative;
    		}
    
    		canvas { 
				width: 100%; 
				height: 100%; 
				display: block; 
			}

		</style>

		<script type="importmap">
			{
			  "imports": {
			    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
			    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
			  }
			}
		</script>
	</head>

	<body>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
		<div id="editor-container"></div>
  		<div id="render-container"></div>
		
		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import * as FX from '/fx_functions.js';
			import * as FXM from '/fx_materials.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';
		
			let scene, camera, renderer, controls;
			let threeContainer = document.getElementById("render-container");

			const CameraDefaultPos = new THREE.Vector3(0, 5, 10);
			const ControlsTargetDefaultPos = new THREE.Vector3(0, 0, 0);

			init();

			async function init() 
			{
				FX.SetupEnvironment("cloud");

				scene = new THREE.Scene();
				camera = new THREE.PerspectiveCamera(24, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 100);
				renderer = new THREE.WebGPURenderer({ antialias: true });
				renderer.inspector = new Inspector();
				renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
				threeContainer.appendChild(renderer.domElement);

				const geometry = new THREE.BoxGeometry( 1, 1, 1 );
				const material=FXM.InstMaterial(0xA6A0A0,0.3,0.731,0,1.5,0.5,false,1,true);
				const cube = new THREE.Mesh( geometry, material );
				cube.position.y=0.5;
				scene.add( cube );

				await renderer.init();

				camera.position.copy(CameraDefaultPos);

				controls = new OrbitControls(camera, renderer.domElement);
				controls.enablePan = false;
				controls.panSpeed = 0.4;
				controls.enableDamping = true;
				controls.target.copy(ControlsTargetDefaultPos);
				controls.zoomSpeed = 0.5;
				controls.autoRotate = true;
				controls.update();

				FX.LoadUltraHDRForWebGPU('./textures/hdri/studio_small_09_2k.jpg',scene);

				//1.設定影子地板尺寸，影子攝影機高度(optional)
				FX.UpdateShadowSpcaceSize({
					ground_width:15,
					ground_height:15,
					camera_height:25
				});

				///2.導入Shadow工具
				FX.InitWebGPUShadow(scene, {
				    shadow: { blur: 0.5, darkness: 0.5 },
				    plane: { color: '#ffffff', opacity: 1 }
				});

				//3.設定影子位置(optional)
				FX.shadowGroup.position.y=-0.5;

				renderer.setAnimationLoop(animate);
				window.addEventListener('resize', onWindowResize);
			}

			function onWindowResize() 
			{
				camera.aspect = threeContainer.clientWidth / threeContainer.clientHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
			}

			function animate(timestamp) 
			{
				controls.update();
				renderer.render(scene, camera);

				///4.繪製到主畫面上
				FX.UpdateWebGPUShadow(renderer, scene);
			}

	</body>
