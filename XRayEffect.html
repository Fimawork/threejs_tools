<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>X-Ray Effect | fx_functions</title>
		<link rel="stylesheet" type="text/css" href="fx_ui.css">
		<style type="text/css">
	
			*{ 
				box-sizing: border-box; 
				margin: 0; 
				padding: 0; 
			}

    		body { 
				display: flex; 
				width: 100vw; 
				height: 100vh; 
				overflow: hidden; 
			}
    
    		/* 左側程式碼編輯區 */
    		#editor-container {
    		  width: 50%;
    		  height: 100%;
    		  background: #1e1e1e;
    		}

    		/* 右側 Three.js 渲染區 */
    		#render-container {
    		  width: 50%;
    		  height: 100%;
    		  position: relative;
    		}
    
    		canvas { 
				width: 100%; 
				height: 100%; 
				display: block; 
			}

		</style>

		<script type="importmap">
			{
			  "imports": {
			    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
			    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js",
			    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
			  }
			}
		</script>
	</head>

	<body>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
		<div id="editor-container"></div>
  		<div id="render-container"></div>

		<script type="module">
			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import * as FX from './fx_functions.js';
			import * as FXM from './fx_materials.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let scene, camera, renderer, controls;
			let threeContainer = document.getElementById("render-container");

			///1.宣告套用X-Ray效果的群組
			let XRayModule=new THREE.Group();

			const CameraDefaultPos = new THREE.Vector3(150.563,124.197,281.439);
			const ControlsTargetDefaultPos = new THREE.Vector3(0, 0, 0);

			init();
			
			async function init() 
			{
				FX.SetupEnvironment("cloud");

				scene = new THREE.Scene();
				camera = new THREE.PerspectiveCamera(24, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
				renderer = new THREE.WebGPURenderer({ antialias: true });
				renderer.inspector = new Inspector();
				renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
				threeContainer.appendChild(renderer.domElement);

				await renderer.init();

				camera.position.copy(CameraDefaultPos);

				controls = new OrbitControls(camera, renderer.domElement);
				controls.enablePan = false;
				controls.panSpeed = 0.4;
				controls.enableDamping = true;
				controls.target.copy(ControlsTargetDefaultPos);
				controls.zoomSpeed = 0.5;
				controls.autoRotate = false;
				controls.update();

				FX.LoadUltraHDRForWebGPU('./textures/hdri/kloofendal_48d_partly_cloudy_puresky_1k.jpg',scene);
				scene.environmentRotation.y  = FX.ToThreeEulerAngle(-60);

				const loader_cushion = new GLTFLoader();
				loader_cushion.setDRACOLoader(FX.dracoLoader);
				loader_cushion.load('./models/RubiksCube.glb', function ( gltf ) {

					const model = gltf.scene;
					model.position.set(0, 0, 0);
					model.scale.set(1, 1, 1);

					model.traverse(function (object) {

						///2.將目標物件加入群組
						if (object.name.includes("part_"))FX.ReturnBufferGeometry(object, null, XRayModule, scene);

					});
				});

				FX.SetupRaycasterEvent(scene,camera,renderer);

				scene.add(XRayModule);
				///3.導入X-Ray效果工具
				FX.SetupXRayEffectModule(XRayModule,0.3);

				renderer.setAnimationLoop(animate);
				
				window.addEventListener('resize', onWindowResize);

				///4.設置X-Ray效果產生條件
				window.addEventListener('Select', DoSomething);
				window.addEventListener('Deselect', ResetFuntion);


				function DoSomething(event) 
				{
				  	// 透過 event.detail 取得被選取的物件
				 	const target = event.detail?.selectedTarget;
				
				  	if (target) 
					{
				  	  	console.log('選中了物件：', target.name, target);

						///套用X-Ray效果
					    FX.SetXRayMode(target);
				  	} 
				}

				function ResetFuntion()
				{
					console.log("取消選取物件");

					///終止X-Ray效果
					FX.SetXRayMode(null);
				}


			}

			function onWindowResize() 
			{
				camera.aspect = threeContainer.clientWidth / threeContainer.clientHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
			}

			function animate(timestamp) 
			{
				controls.update();
				renderer.render(scene, camera);
			}

		
const code_content = `

			// 3. 載入 Monaco Editor 顯示左側程式碼
require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
require(['vs/editor/editor.main'], function() {
  monaco.editor.create(document.getElementById('editor-container'), {

    theme: 'vs-dark',

		</script>
	</body>
</html>
